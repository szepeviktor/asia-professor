<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asia Professor - Round 03</title>
  <style>
    :root {
      --ink: #151a20;
      --muted: #68717d;
      --paper: #f6efe4;
      --panel: rgba(255, 255, 255, .86);
      --line: rgba(21, 26, 32, .14);
      --gold: #c8942d;
      --ok: #167a4a;
      --bad: #b23a38;
      --shadow: 0 18px 44px rgba(21, 26, 32, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(200, 148, 45, .22), transparent 28rem),
        radial-gradient(circle at 86% 75%, rgba(48, 114, 125, .18), transparent 30rem),
        linear-gradient(135deg, #f4eadb, #e7f0ee 52%, #f9ece7);
    }

    button {
      font: inherit;
    }

    .wrap {
      min-height: 100vh;
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(14px, 3vw, 32px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(2rem, 6vw, 4.8rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .meter {
      min-width: 122px;
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .score {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-weight: 850;
      box-shadow: 0 10px 24px rgba(21, 26, 32, .10);
    }

    .bar {
      width: min(100%, 180px);
      height: 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: rgba(255, 255, 255, .56);
    }

    .bar span {
      display: block;
      width: var(--progress, 0%);
      height: 100%;
      background: linear-gradient(90deg, #bc3138, #d49a2c, #2e7180);
      transition: width .28s ease;
    }

    main {
      display: grid;
      align-content: center;
      gap: 16px;
    }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(270px, .65fr);
      gap: 16px;
      align-items: stretch;
    }

    .media {
      position: relative;
      min-height: 580px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #111;
      box-shadow: var(--shadow);
    }

    .media img,
    .media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .media[data-type="image"] img,
    .media[data-type="video"] video {
      display: block;
    }

    .audio-prompt {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0)),
        #111820;
    }

    .media[data-type="audio"] .audio-prompt {
      display: grid;
    }

    .audio-prompt audio {
      width: min(460px, 92%);
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .3));
    }

    .badge {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 2;
      min-width: 76px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(10, 12, 14, .54);
      color: #fff;
      text-align: center;
      font-size: 1.6rem;
      backdrop-filter: blur(8px);
    }

    .side {
      min-height: 580px;
      padding: clamp(14px, 3vw, 22px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 1fr;
      gap: 14px;
    }

    .choice {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-variant-emoji: emoji;
    }

    .choice {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .74);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .icon-button {
      min-width: 92px;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .74);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .icon-button {
      position: relative;
    }

    .icon-button::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      border: 3px solid var(--ink);
      border-right-color: transparent;
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-35deg);
    }

    .icon-button::after {
      content: "";
      position: absolute;
      left: calc(50% + 9px);
      top: calc(50% - 13px);
      width: 0;
      height: 0;
      border-left: 8px solid var(--ink);
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      transform: rotate(20deg);
    }

    .choice:hover,
    .choice:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 10px 20px rgba(21, 26, 32, .12);
      outline: none;
    }

    .choices {
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .choice {
      min-height: 128px;
      display: grid;
      place-items: center;
      font-size: clamp(3.4rem, 12vw, 5.8rem);
      line-height: 1;
    }

    .choice[disabled],
    .icon-button[disabled] {
      cursor: default;
      transform: none;
      opacity: .72;
    }

    .choice.correct {
      border-color: var(--ok);
      box-shadow: 0 0 0 4px rgba(22, 122, 74, .16);
    }

    .choice.wrong {
      border-color: var(--bad);
      box-shadow: 0 0 0 4px rgba(178, 58, 56, .16);
    }

    .result {
      display: none;
      min-height: 580px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .result.show {
      display: grid;
    }

    .result-inner {
      display: grid;
      gap: 20px;
      justify-items: center;
    }

    .result-score {
      font-size: clamp(3.8rem, 14vw, 8rem);
      font-weight: 900;
      line-height: 1;
    }

    @media (max-width: 820px) {
      .game {
        grid-template-columns: 1fr;
      }

      .media,
      .side,
      .result {
        min-height: 420px;
      }

      .side {
        grid-template-rows: 1fr;
      }
    }

    @media (max-width: 480px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .meter {
        width: 100%;
        justify-items: stretch;
      }

      .bar {
        width: 100%;
      }

      .choice {
        min-height: 96px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Asia Professor</h1>
      <div class="meter">
        <div class="score" id="score">0/10</div>
        <div class="bar" aria-hidden="true"><span id="bar"></span></div>
      </div>
    </header>

    <main>
      <section class="game" id="game">
        <div class="media" id="media">
          <div class="badge" id="badge">1/10</div>
          <img id="photo" alt="">
          <video id="clip" controls playsinline></video>
          <div class="audio-prompt">
            <audio id="audioPrompt" controls></audio>
          </div>
        </div>

        <aside class="side">
          <div class="choices">
            <button class="choice" type="button" data-choice="china" aria-label="Kína">🇨🇳</button>
            <button class="choice" type="button" data-choice="japan" aria-label="Japán">🇯🇵</button>
          </div>
        </aside>
      </section>

      <section class="result" id="result">
        <div class="result-inner">
          <div class="result-score" id="resultScore">0/10</div>
          <button class="icon-button" id="restart" type="button" aria-label="Új játék"></button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const items = shuffle([
      ["r3-china-shanghai", "china", "image"],
      ["r3-japan-osaka", "japan", "image"],
      ["r3-china-calligraphy", "china", "image"],
      ["r3-japan-calligraphy", "japan", "image"],
      ["r3-china-panda", "china", "image"],
      ["r3-japan-macaque", "japan", "image"],
      ["r3-china-audio", "china", "audio"],
      ["r3-japan-audio", "japan", "audio"],
      ["r3-china-video", "china", "video"],
      ["r3-japan-video", "japan", "video"]
    ].map(([slug, answer, type]) => ({
      slug,
      answer,
      type,
      image: `assets/${slug}.png`,
      video: `assets/${slug}.mp4`,
      audio: `assets/${slug}.wav`
    })));

    let index = 0;
    let score = 0;
    let answered = false;

    const scoreEl = document.getElementById("score");
    const bar = document.getElementById("bar");
    const game = document.getElementById("game");
    const result = document.getElementById("result");
    const media = document.getElementById("media");
    const badge = document.getElementById("badge");
    const photo = document.getElementById("photo");
    const clip = document.getElementById("clip");
    const audioPrompt = document.getElementById("audioPrompt");
    const restart = document.getElementById("restart");
    const choices = [...document.querySelectorAll(".choice")];

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render() {
      const item = items[index];
      answered = false;
      scoreEl.textContent = `${score}/${items.length}`;
      badge.textContent = `${index + 1}/${items.length}`;
      bar.style.setProperty("--progress", `${(index / items.length) * 100}%`);
      media.dataset.type = "loading";
      clip.pause();
      audioPrompt.pause();
      photo.removeAttribute("src");
      clip.removeAttribute("src");
      audioPrompt.removeAttribute("src");
      clip.load();
      audioPrompt.load();
      if (item.type === "image") {
        photo.src = item.image;
      }
      if (item.type === "video") {
        clip.src = item.video;
        clip.currentTime = 0;
      }
      if (item.type === "audio") {
        audioPrompt.src = item.audio;
        audioPrompt.currentTime = 0;
      }
      media.dataset.type = item.type;
      if (item.type === "video") {
        clip.play().catch(() => {});
      }
      if (item.type === "audio") {
        audioPrompt.play().catch(() => {});
      }
      choices.forEach((choice) => {
        choice.disabled = false;
        choice.classList.remove("correct", "wrong");
      });
    }

    function nextQuestion() {
      window.setTimeout(() => {
        index += 1;
        if (index >= items.length) {
          finish();
        } else {
          render();
        }
      }, 950);
    }

    function choose(choice) {
      if (answered) return;
      answered = true;
      const item = items[index];
      const ok = choice === item.answer;
      if (ok) score += 1;
      scoreEl.textContent = `${score}/${items.length}`;

      choices.forEach((button) => {
        button.disabled = true;
        if (button.dataset.choice === item.answer) button.classList.add("correct");
        if (button.dataset.choice === choice && !ok) button.classList.add("wrong");
      });

      nextQuestion();
    }

    function finish() {
      game.style.display = "none";
      result.classList.add("show");
      bar.style.setProperty("--progress", "100%");
      document.getElementById("resultScore").textContent = `${score}/${items.length}`;
    }

    choices.forEach((button) => button.addEventListener("click", () => choose(button.dataset.choice)));
    restart.addEventListener("click", () => {
      index = 0;
      score = 0;
      game.style.display = "";
      result.classList.remove("show");
      render();
    });

    render();
  </script>
</body>
</html>
