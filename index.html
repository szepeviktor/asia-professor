<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asia Professor</title>
  <style>
    :root {
      --ink: #151a20;
      --panel: rgba(255, 255, 255, .86);
      --line: rgba(21, 26, 32, .14);
      --shadow: 0 18px 44px rgba(21, 26, 32, .16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(200, 148, 45, .22), transparent 28rem),
        radial-gradient(circle at 86% 75%, rgba(48, 114, 125, .18), transparent 30rem),
        linear-gradient(135deg, #f4eadb, #e7f0ee 52%, #f9ece7);
    }

    main {
      width: min(860px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(20px, 5vw, 56px);
      display: grid;
      align-content: center;
      gap: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      line-height: 1;
      letter-spacing: 0;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    a {
      min-height: 140px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: inherit;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: clamp(2rem, 7vw, 4.2rem);
      font-weight: 900;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 22px 48px rgba(21, 26, 32, .2);
      outline: none;
    }

    @media (max-width: 640px) {
      nav {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 96px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Asia Professor</h1>
    <nav aria-label="Rounds">
      <a href="round-01.html">01</a>
      <a href="round-02.html">02</a>
      <a href="round-03.html">03</a>
    </nav>
  </main>
</body>
</html>
